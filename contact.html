<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Deborah Paul | Contact</title>
  <style>
    :root{
      --bg: #12071F;
      --card: rgba(255,255,255,.06);
      --text: #F5F0FF;
      --muted: rgba(245,240,255,.78);
      --accent: #FF5DA2;
      --accent2: #C77DFF;
      --border: rgba(255,255,255,.12);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: linear-gradient(180deg, #12071F, #2A0B2F);
      color: var(--text);
    }
    header{
      position: sticky; top:0; z-index:10;
      backdrop-filter: blur(10px);
      background: rgba(18,7,31,.7);
      border-bottom: 1px solid var(--border);
    }
    nav{
      max-width: 1000px;
      margin: 0 auto;
      padding: 14px 18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
    }
    .nav-links{display:flex; gap:10px; flex-wrap:wrap;}
    .nav-links a{
      text-decoration:none;
      color: var(--text);
      padding:10px 12px;
      border-radius:999px;
      border:1px solid transparent;
      transition:.2s;
      font-size:14px;
    }
    .nav-links a:hover{
      border-color: rgba(255,93,162,.45);
      background: rgba(255,93,162,.12);
    }
    .container{max-width:1000px;margin:0 auto;padding:34px 18px 60px;}
    .card{
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
    }
    h2{margin:0 0 12px}
    label{display:block; margin:10px 0 6px; color: var(--muted); font-size: 14px;}
    input, textarea{
      width:100%;
      padding: 12px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.04);
      color: var(--text);
      outline:none;
    }
    textarea{min-height:120px; resize: vertical;}
    input::placeholder, textarea::placeholder{color: rgba(245,240,255,.45);}
    .row{display:grid; grid-template-columns: 1fr 1fr; gap:12px;}
    @media (max-width: 720px){ .row{grid-template-columns:1fr;} }
    .btn{
      display:inline-flex; align-items:center; justify-content:center;
      padding: 12px 16px;
      border-radius: 12px;
      text-decoration:none;
      font-weight:700;
      border:1px solid var(--border);
      cursor:pointer;
      transition:.2s;
      background: rgba(255,255,255,.04);
      color: var(--text);
      margin-top: 14px;
      width: 100%;
    }
    .btn.primary{
      background: linear-gradient(135deg, rgba(255,93,162,.95), rgba(199,125,255,.85));
      border-color: rgba(255,255,255,.18);
      color:#120817;
    }
    footer{
      border-top: 1px solid var(--border);
      padding: 18px;
      color: var(--muted);
      text-align:center;
    }
  </style>
</head>
<body>
<header>
  <nav>
    <div class="brand">
      <strong>Deborah Paul</strong>
      <span>Perfume Company • Contact</span>
    </div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="products.html">Collection</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </div>
  </nav>
</header>

<main class="container">
  <div class="card">
    <h2>Contact Us</h2>
    <p style="margin:0 0 10px; color: var(--muted); line-height:1.6;">
      Send a message directly to Deborah Paul at:
      <b style="color:var(--text);">deborahpaul406@gmail.com</b>
    </p>

    <!-- Email space connected via mailto -->
    <form action="mailto:deborahpaul406@gmail.com" method="post" enctype="text/plain">
      <div class="row">
        <div>
          <label for="name">Your Name</label>
          <input id="name" name="name" type="text" placeholder="e.g., Amina Rose" required />
        </div>
        <div>
          <label for="email">Your Email</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" required />
        </div>
      </div>

      <label for="message">Message</label>
      <textarea id="message" name="message" placeholder="Tell us what kind of fragrance you’re looking for..." required></textarea>

      <!-- This submits to the mailto email above -->
      <button class="btn primary" type="submit">Send Email</button>
    </form>
  </div>
</main>

<footer>
  © <span id="year"></span> Deborah Paul Perfume Company. All rights reserved.
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();
</script>
</body>
</html>
